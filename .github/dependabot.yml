version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # quarkus-openapi-generator en quarkus-openapi-generator-server komen uit
    # dezelfde reactor/release en moeten volgens pom.xml dezelfde versie
    # dragen. Ongegroepeerd bumpt dependabot er één, zoals in #118.
    groups:
      quarkus-openapi-generator:
        patterns:
          - "io.quarkiverse.openapi.generator:*"
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: "weekly"
    # init, analyze en upload-sarif zijn losse dependencies binnen dezelfde
    # release. Ongegroepeerd bumpt dependabot ze in aparte PR's, waarna de
    # Analyze-job faalt op "Loaded a configuration file for version X, but
    # running version Y". Groeperen houdt ze gelijk.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
