version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: "weekly"
    # init, analyze en upload-sarif zijn losse dependencies binnen dezelfde
    # release. Ongegroepeerd bumpt dependabot ze in aparte PR's, waarna de
    # Analyze-job faalt op "Loaded a configuration file for version X, but
    # running version Y". Groeperen houdt ze gelijk.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
