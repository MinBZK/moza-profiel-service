quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.devservices.enabled=false

# Tests skip Flyway and let Hibernate build the schema from entities.
# Trade-off: tests don't exercise the actual V*.sql migrations; they exercise
# entity definitions on H2 instead. Running them against a real Postgres would
# need a separate, properly isolated test setup (a Postgres-backed @QuarkusTest
# and the H2-backed suite can't safely share one Surefire fork: db-kind is a
# Quarkus build-time property, so switching it mid-run corrupts the already-built
# app for whichever suite runs after).
quarkus.flyway.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

logboekdataverwerking.enabled=false
