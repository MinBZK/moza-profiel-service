quarkus.devservices.enabled=false

# Tests run against a real PostgreSQL, started as a child process of the test
# JVM by EmbeddedPostgresTestResource (no Docker required, so this also works
# on the LPC CI runners). Flyway runs the actual V*.sql migrations and the
# inherited `validate` strategy fails the run on entity/migration drift.
# clean-at-start wipes the schema on every Quarkus boot, so each boot starts
# from a freshly migrated database.
quarkus.flyway.clean-disabled=false
quarkus.flyway.clean-at-start=true

logboekdataverwerking.enabled=false

# De quarkus-jacoco extensie verwijdert het exec-bestand standaard bij de start van
# de testrun. Dat zou de dekking van de gewone (niet-@QuarkusTest) unittests wissen,
# die door de JaCoCo-agent op de surefire-JVM wordt opgebouwd. Zie pom.xml.
quarkus.jacoco.reuse-data-file=true

# Gegenereerde code en de externe clients tellen niet mee in de dekking. Deze sleutel
# stond eerder in src/main/resources/application.properties; quarkus-jacoco is
# test-scoped, dus daar kende de productie-augmentatie hem niet en waarschuwde
# quarkus:build dat hij genegeerd werd. Deze sleutel filtert de klassenlijst voor het
# rapport van de quarkus-jacoco-extensie. De gate zelf (jacoco:check) leest een eigen
# lijst uit pom.xml; die twee horen letterlijk gelijk te blijven, anders wijken rapport
# en gate uiteen zonder dat de build daarover klaagt.
quarkus.jacoco.excludes=nl/rijksoverheid/moz/external/**/*,nl/rijksoverheid/moz/api/generated/**/*
