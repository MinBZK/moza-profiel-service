quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.devservices.enabled=false

# Tests skip Flyway and let Hibernate build the schema from entities.
# Trade-off: tests don't exercise the actual V*.sql migrations; they exercise
# entity definitions on H2 instead. CI has no Docker, so a real Postgres
# datasource would require a service container in .gitlab-ci.yml.
quarkus.flyway.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

logboekdataverwerking.enabled=false

# De quarkus-jacoco extensie verwijdert het exec-bestand standaard bij de start van
# de testrun. Dat zou de dekking van de gewone (niet-@QuarkusTest) unittests wissen,
# die door de JaCoCo-agent op de surefire-JVM wordt opgebouwd. Zie pom.xml.
quarkus.jacoco.reuse-data-file=true

# Gegenereerde code en de externe clients tellen niet mee in de dekking. Deze sleutel
# stond eerder in src/main/resources/application.properties; quarkus-jacoco is
# test-scoped, dus daar kende de productie-augmentatie hem niet en waarschuwde
# quarkus:build dat hij genegeerd werd. De uitsluiting zelf werkte wel, maar alleen
# omdat pom.xml dezelfde lijst nog eens aan de JaCoCo-agent meegeeft — die twee horen
# gelijk te blijven.
quarkus.jacoco.excludes=nl/rijksoverheid/moz/external/**,nl/rijksoverheid/moz/api/generated/**
