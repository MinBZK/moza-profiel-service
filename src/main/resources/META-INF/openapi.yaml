        contactgegevens:
          type: array
          items:
            $ref: "#/components/schemas/ContactgegevenResponse"
    ScopeRequest:
      description: "Beperkt een contactgegeven of voorkeur tot een dienstverlener,\
        \ eventueel tot een dienst daarbinnen. Een leeg object betekent geen scope.\
        \ Een dienstNaam zonder dienstverlenerNaam levert een 400."
      type: [object, "null"]
      properties:
        dienstverlenerNaam:
          type: [string, "null"]
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        dienstNaam:
          type: [string, "null"]
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
    ScopeResponse:
      # Zie ContactgegevenResponse. dienstNaam is bewust optioneel: een dienstverlener-brede
      # scope heeft geen dienst (dd.dienst IS NULL) en stuurt het veld dus als null mee.
      type: object
      required:
      - dienstverlenerNaam
      properties:
        dienstverlenerNaam:
          type: string
        dienstNaam:
          type: [string, "null"]
    UUID:
      type: string
      format: uuid
      # Bewust geen pattern ernaast: format legt de vorm al vast, en op een path-parameter
      # zet de generator er @Pattern van op een java.util.UUID (de schemaMapping). Hibernate
      # Validator heeft voor die combinatie geen validator en werpt HV000030, wat elke DELETE
      # op een 500 zet. In de DTO's speelt dat niet: daar laat de generator de pattern weg.
    Violation:
