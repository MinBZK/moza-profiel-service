      - 2022-03-10T16:15:50Z
    PartijBulkRequest:
      type: object
      required:
      - identificaties
      properties:
        identificaties:
          # Begrenst de amplificatie: per teruggegeven rij haalt het mappen lazy collecties
          # op en doet touchIfStale zo nodig een UPDATE. 100 ligt ruim boven normaal
          # gebruik; overschrijding levert een 400 op.
          type: array
