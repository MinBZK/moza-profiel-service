    PartijRequest:
      description: "Request object voor het ophalen van een Partij. dienstverlener en\
        \ dienstNaam filteren de contactgegevens en voorkeuren in het antwoord; laat je beide\
        \ weg, dan komt het hele profiel terug. Gegevens zonder scope komen altijd mee.\
        \ dienstverlener houdt daarnaast de gegevens over die op die dienstverlener gescoped\
        \ zijn. dienstNaam houdt de gegevens over die op een dienst met die naam gescoped\
        \ zijn, plus de dienstverlener-brede scopes (een scope zonder dienst). De twee velden\
        \ zijn onafhankelijk: dienstNaam zonder dienstverlener filtert dus op dienstnaam over\
        \ alle dienstverleners heen."
      type: object
      required:
      - identificatieType
      - identificatieNummer
      properties:
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        dienstverlener:
          type: [string, "null"]
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        dienstNaam:
          type: [string, "null"]
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
    PartijResponse:
      # Zie ContactgegevenResponse. De drie lijsten zijn altijd aanwezig en hooguit leeg.
      type: object
      required:
