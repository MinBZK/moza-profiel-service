---
openapi: 3.1.0
info:
  title: MOZa Profiel Service API
  version: 1.0.0
  description: "Profiel service voor MijnOverheid Zakelijk: beheer van contactgegevens
    en communicatievoorkeuren van partijen."
  contact:
    name: MijnOverheid Zakelijk Team
    email: moza@minbzk.nl
    url: https://docs.mijnoverheidzakelijk.nl
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/software/page/eupl
tags:
- name: Dienstverlener
  description: Endpoints voor het beheren van dienstverleners en diensten
- name: EmailVerificatie
  description: Endpoints voor het verifiëren van emails
- name: Profiel
  description: Endpoints voor het beheren van partijen
# De responses staan per operatie op volgorde: eerst de succescode, daarna de
# foutcodes oplopend. Voor OpenAPI zelf is die volgorde betekenisloos, maar zodra
# server-interfaces gegenereerd worden (#751) leidt de generator er @Produces uit
# af, en kiest JAX-RS de eerste vermelde media type als standaard. Staat een
# foutrespons vooraan, dan krijgt elk succesantwoord application/problem+json.
paths:
  /api/profielservice/v1/contactgegeven:
    put:
      summary: Update contactgegeven van een partij
      operationId: updateContactgegeven
      description: "Werk type, waarde, scope, isDefault en teVerwijderenOp van een contactgegeven\
        \ bij. Identificatie kan niet aangepast worden. isDefault weglaten of op null zetten\
        \ laat de huidige waarde staan; op true zetten degradeert het contactgegeven dat nu\
        \ default is voor hetzelfde type."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactgegevenUpdateRequest"
        required: true
      responses:
        "200":
          description: Contactgegeven succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ContactgegevenOfScopeNietGevonden"
        "409":
          description: "Combinatie van type en waarde bestaat al voor deze partij, of een\
            \ gelijktijdige write botste op een unique constraint"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
    post:
      summary: Toevoegen nieuwe contactgegeven voor een partij
      operationId: addContactgegeven
      description: "Voegt een contactgegeven toe. Creëert automatisch ontbrekende partijen.\
        \ Bestaat de combinatie (partij, type, waarde) al — voor type Email wordt de waarde\
        \ daarbij case-insensitief vergeleken — dan komt er geen tweede rij bij en volgt een\
        \ 200. Op dat bestaande contactgegeven wordt wel een meegestuurde teVerwijderenOp\
        \ toegepast, krijgt een nog niet geverifieerd e-mailadres een nieuwe verificatiecode\
        \ toegestuurd, en wordt de scope zo nodig uitgebreid. Een meegestuurde teVerwijderenOp\
        \ moet in de toekomst liggen en hooguit 7 jaar na de referentiedatum; buiten dat\
        \ bereik volgt een 400."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactgegevenRequest"
        required: true
      responses:
        "200":
          description: Contactgegeven was al geregistreerd voor deze partij en scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactgegevenResponse"
        "201":
          description: Contactgegeven succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactgegevenResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ScopeUitRequestNietGevonden"
        "409":
          $ref: "#/components/responses/GelijktijdigeWrite"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/contactgegeven/te-verwijderen-op:
    patch:
      summary: Stel te-verwijderen-op in voor een contactgegeven (Dienstverlener)
      operationId: updateContactgegevenTeVerwijderenOp
      description: Stelt of overschrijft de te-verwijderen-op datum voor een contactgegeven.
        Alleen toegestaan voor een Dienstverlener met een bestaande scope op het contactgegeven.
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeVerwijderenOpRequest"
        required: true
      responses:
        "200":
          description: Te-verwijderen-op succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "403":
          description: Dienstverlener heeft geen scope op dit contactgegeven
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "404":
          $ref: "#/components/responses/ContactgegevenNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/contactgegeven/{contactgegevenId}:
    delete:
      summary: Verwijder contactgegeven van een partij
      operationId: deleteContactgegeven
      description: Verwijdert een contactgegeven volledig
      tags:
      - Profiel
      parameters:
      - name: contactgegevenId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijIdentificatieRequest"
        required: true
      responses:
        "204":
          description: Contactgegeven succesvol verwijderd
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ContactgegevenNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener:
    post:
      summary: Voegt een dienstverlener toe
      operationId: addDienstverlener
      description: "Voegt een dienstverlener toe met optionele beschrijving. Bestaat de naam\
        \ al, dan wordt de bestaande dienstverlener teruggegeven; een afwijkende beschrijving\
        \ levert een 409 in plaats van een stille overschrijving. De beschrijving ligt daarmee\
        \ vast bij het aanmaken: er is geen operatie om hem later te wijzigen. Let op dat een\
        \ dienstverlener ook impliciet ontstaat via POST /dienstverlener/{dienstverlenerNaam}/diensten,\
        \ en dan géén beschrijving krijgt; die kan achteraf niet meer worden gezet."
      tags:
      - Dienstverlener
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DienstverlenerRequest"
        required: true
      responses:
        "201":
          description: Dienstverlener succesvol toegevoegd of al aanwezig met dezelfde
            beschrijving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstverlenerResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "409":
          description: "Dienstverlener bestaat al met een andere beschrijving, of een\
            \ gelijktijdige write botste op een unique constraint"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener/{dienstverlenerNaam}/diensten:
    post:
      summary: Voegt een dienst toe aan een dienstverlener
      operationId: addDienstToDienstverlener
      description: "Voegt een dienst toe aan een dienstverlener. Bestaat de dienstverlener\
        \ nog niet, dan wordt hij aangemaakt zonder beschrijving; vandaar dat deze operatie\
        \ geen 404 kent."
      tags:
      - Dienstverlener
      parameters:
      - name: dienstverlenerNaam
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DienstRequest"
        required: true
      responses:
        "201":
          description: Dienst succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "409":
          description: "Dienst bestaat al met een andere beschrijving, of een gelijktijdige\
            \ write botste op een unique constraint"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener/{naam}:
    get:
      summary: Vraagt gegevens van dienstverlener
      operationId: getDienstverlener
      description: "Geeft gegevens van gevraagde dienstverlener terug, inclusief de\
        \ aangesloten diensten."
      tags:
      - Dienstverlener
      parameters:
      - name: naam
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Dienstverlener succesvol opgehaald
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstverlenerResponse"
        "404":
          description: Dienstverlener niet gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/emailverificatie:
    post:
      summary: Verifieer een email met een verificatie code
      operationId: verifieerEmail
      description: Verifieert een email adres aan de hand van de eerder aangevraagde
        verificatie code.
      tags:
      - EmailVerificatie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificatieRequest"
        required: true
      responses:
        "200":
          description: Email verificatie succesvol
        "400":
          description: "Request body ontbreekt, is ongeldig (schemaviolatie of een\
            \ identificatieNummer dat niet bij het identificatieType past; dan is\
            \ `violations` gevuld), of de verificatie is mislukt."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpValidationProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/emailverificatie/code:
    post:
      summary: (Opnieuw) aanvragen voor een code van een (al geverifieerde) mail adres
      operationId: vraagEmailVerificatieCodeAan
      description: "Vraagt een email verificatie code aan. Let op, bij het aanmaken\
        \ van een profiel wordt al een email verificatie code aangevraagd. Dit is\
        \ voor het opnieuw aanvragen van een code."
      tags:
      - EmailVerificatie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificatieCodeAanvraagRequest"
        required: true
      responses:
        "200":
          description: Email verificatie code aanvraag succesvol
        "400":
          description: "Request body ontbreekt of is ongeldig. Bij bean-validatie is\
            \ `violations` gevuld."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpValidationProblem"
        "404":
          description: Partij of Contactgegeven niet gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
        "503":
          description: Service tijdelijk niet beschikbaar
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
  /api/profielservice/v1/partij:
    post:
      summary: Ophalen profiel van een partij
      operationId: getPartij
      description: Haalt het profiel op van een partij
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijRequest"
        required: true
      responses:
        "200":
          description: Partij succesvol opgehaald
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartijResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          description: Partij niet gevonden of is verwijderd
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/partijen/bulk:
    post:
      summary: Ophalen profielen van meerdere partijen
      operationId: getPartijBulk
      description: Haalt profielen op van meerdere partijen. Niet-gevonden partijen
        worden stilzwijgend weggelaten.
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijBulkRequest"
        required: true
      responses:
        "200":
          description: Alle profielen succesvol opgehaald
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartijResponse"
        "206":
          description: Profielen gedeeltelijk opgehaald
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartijResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          description: Geen enkel profiel gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/voorkeur:
    put:
      summary: Update voorkeur van een partij
      operationId: updateVoorkeur
      description: "Werk voorkeurType, waarde, scope en teVerwijderenOp van een voorkeur bij.\
        \ Identificatie kan niet aangepast worden."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoorkeurUpdateRequest"
        required: true
      responses:
        "200":
          description: Voorkeur succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/VoorkeurOfScopeNietGevonden"
        "409":
          description: "Andere voorkeur bestaat al voor deze partij, type en scope, of een\
            \ gelijktijdige write botste op een unique constraint"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
    post:
      summary: Toevoegen nieuwe voorkeur voor een partij
      operationId: addVoorkeur
      description: "Voegt een voorkeur toe. Creëert automatisch ontbrekende partijen.\
        \ Per (partij, voorkeurType, scope) bestaat er hooguit één voorkeur, dus dit is een\
        \ upsert: bestaat de combinatie al, dan overschrijft een afwijkende waarde de\
        \ bestaande in plaats van een tweede rij aan te maken."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoorkeurRequest"
        required: true
      responses:
        "200":
          description: Voorkeur was al geregistreerd voor deze partij en scope; een
            afwijkende waarde is overschreven
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoorkeurResponse"
        "201":
          description: Voorkeur succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoorkeurResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ScopeUitRequestNietGevonden"
        "409":
          $ref: "#/components/responses/GelijktijdigeWrite"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/voorkeur/te-verwijderen-op:
    patch:
      summary: Stel te-verwijderen-op in voor een voorkeur (Dienstverlener)
      operationId: updateVoorkeurTeVerwijderenOp
      description: Stelt of overschrijft de te-verwijderen-op datum voor een voorkeur.
        Alleen toegestaan voor een Dienstverlener met een bestaande scope op de voorkeur.
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeVerwijderenOpRequest"
        required: true
      responses:
        "200":
          description: Te-verwijderen-op succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "403":
          description: Dienstverlener heeft geen scope op deze voorkeur
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "404":
          $ref: "#/components/responses/VoorkeurNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/voorkeur/{voorkeurId}:
    delete:
      summary: Verwijder voorkeur van een partij
      operationId: deleteVoorkeur
      description: Verwijdert een voorkeur volledig
      tags:
      - Profiel
      parameters:
      - name: voorkeurId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijIdentificatieRequest"
        required: true
      responses:
        "204":
          description: Voorkeur succesvol verwijderd
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/VoorkeurNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
components:
  responses:
    InterneServerfout:
      description: Interne serverfout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    OngeldigeRequestBody:
      description: Request body ontbreekt of is ongeldig
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpValidationProblem"
    ContactgegevenOfScopeNietGevonden:
      description: "Contactgegeven of partij niet gevonden, of de dienstverlener of\
        \ dienst uit de opgegeven scope bestaat niet"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    VoorkeurOfScopeNietGevonden:
      description: "Voorkeur of partij niet gevonden, of de dienstverlener of dienst\
        \ uit de opgegeven scope bestaat niet"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    ContactgegevenNietGevonden:
      description: Contactgegeven of partij niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    VoorkeurNietGevonden:
      description: Voorkeur of partij niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    ScopeUitRequestNietGevonden:
      description: Dienstverlener of dienst uit de scope bestaat niet
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    GelijktijdigeWrite:
      # Lookup-dan-persist: twee gelijktijdige writes kunnen de voorcontrole passeren en pas
      # bij flush op een unique index botsen (onder meer uk_identificatie,
      # uk_contactgegeven_dedup, uk_dvdienst_dv_broad).
      # DatabaseConstraintViolationMapper is bedoeld om dat naar deze 409 te vertalen; dat
      # de vertaling in dit pad ook echt aanslaat is niet vastgelegd — de race is over HTTP
      # niet betrouwbaar te reproduceren.
      description: Gelijktijdige write botste op een unique constraint
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
  schemas:
    # De contractvalidatie handhaaft type niet (3.1-typen komen niet door de validator);
    # required, enum, pattern, format, minItems en maxItems wél. Nullable-typen zijn hier
    # dus documentatie voor de consumer, geen bewaking.
    #
    # Nullbaarheid van een $ref-veld hoort daarom in de beschrijving van zijn schema en
    # niet in een anyOf met een null-tak: die tak matcht alles, waarmee de $ref-tak nooit
    # meer wordt gecontroleerd. ContractHandhavingTest legt dat vast.
    #
    # De pattern "^[^\r\n]*\S[^\r\n]*$" op de tekstvelden die een betekenisvolle waarde
    # moeten dragen — verplicht én optioneel, zoals de scope-velden — wijst lege en
    # alleen-witruimte waarden af (#766), en meteen ook CR/LF. Hij is met opzet zo
    # geschreven en niet als ".*\S.*": Jakarta @Pattern doet een full match waarbij "."
    # geen newline matcht, en de inline-vlag "(?s)" die dat repareert bestaat niet in
    # ECMA 262 — daarmee wordt het contract ongeldig en valt de contractvalidatie op elk
    # endpoint om. Zie BlancoWaardenIntegrationTest voor de volledige afweging.
    ContactType:
      type: string
      enum:
      - Email
      - Telefoonnummer
      - ApplicatieId
    ContactgegevenRequest:
      description: "Request object voor het toevoegen van een contactgegeven aan een partij. scope en teVerwijderenOp mogen worden weggelaten of expliciet op null gezet; beide betekenen dat het veld niet is opgegeven."
      type: object
      required:
      - identificatieType
      - identificatieNummer
      - type
      - waarde
      properties:
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        type:
          $ref: "#/components/schemas/ContactType"
        waarde:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        scope:
          $ref: "#/components/schemas/ScopeRequest"
        teVerwijderenOp:
          $ref: "#/components/schemas/Instant"
    ContactgegevenResponse:
      description: "Contactgegeven van een partij. teVerwijderenOp is null zolang er geen verwijderdatum is gezet."
      # De velden die de server altijd meestuurt staan als required, zodat een consumer niet
      # defensief hoeft te coderen tegen nulls die niet kunnen optreden. Wat optioneel is,
      # draagt "null" in zijn type: Jackson staat hier op de standaard ALWAYS-inclusie, dus
      # een leeg veld gaat als expliciete null over de lijn en niet als ontbrekende sleutel.
      #
      # required bewaakt de mapper niet: het vraagt alleen of de sleutel er is, en die is er
      # altijd — ook met waarde null. Het documenteert wat een consumer mag verwachten.
      #
      # De nullable velden staan niet in required omdat de generator er dan @NotNull op zet.
      type: object
      required:
      - id
      - type
      - waarde
      - isGeverifieerd
      - isDefault
      - createdAt
      - lastUpdated
      - scopes
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/ContactType"
        waarde:
          type: string
        isGeverifieerd:
          type: boolean
        isDefault:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Instant"
        lastUpdated:
          $ref: "#/components/schemas/Instant"
        teVerwijderenOp:
          $ref: "#/components/schemas/Instant"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeResponse"
    ContactgegevenUpdateRequest:
