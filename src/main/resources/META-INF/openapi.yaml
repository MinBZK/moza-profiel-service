---
openapi: 3.1.0
info:
  title: MOZa Profiel Service API
  version: 1.0.0
  description: "Profiel service voor MijnOverheid Zakelijk: beheer van contactgegevens
    en communicatievoorkeuren van partijen."
  contact:
    name: MijnOverheid Zakelijk Team
    email: moza@minbzk.nl
    url: https://docs.mijnoverheidzakelijk.nl
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/software/page/eupl
tags:
- name: Dienstverlener
  description: Endpoints voor het beheren van dienstverleners en diensten
- name: EmailVerificatie
  description: Endpoints voor het verifiëren van emails
- name: Profiel
  description: Endpoints voor het beheren van partijen
# De responses staan per operatie op volgorde: eerst de succescode, daarna de
# foutcodes oplopend. Voor OpenAPI zelf is die volgorde betekenisloos, maar omdat er
# server-interfaces gegenereerd worden, leidt de generator er @Produces uit
# af, en kiest JAX-RS de eerste vermelde media type als standaard. Staat een
# foutrespons vooraan, dan krijgt elk succesantwoord application/problem+json.
#
# Om dezelfde reden bepaalt het geheel van gedeclareerde mediatypes wélke Accept-
# header een operatie bedient: zonder JSON-succesbody blijft alleen
# application/problem+json over, en volgt een 406 op een verzoek dat uitsluitend
# application/json accepteert. AcceptHeaderIntegrationTest legt dat vast.
#
# De 406 staat bij géén enkele operatie als response: hij komt niet uit de
# applicatie maar uit de content-onderhandeling van JAX-RS, en kan elke operatie
# treffen.
paths:
  /api/profielservice/v1/contactgegeven:
    put:
      summary: Update contactgegeven van een partij
      operationId: updateContactgegeven
      description: "Werk type, waarde en isDefault van een contactgegeven bij en voeg optioneel\
        \ een scope toe. Bestaande scopes blijven behouden — scope wordt toegevoegd, niet\
        \ vervangen. Identificatie kan niet aangepast worden. isDefault weglaten of op null\
        \ zetten laat de huidige waarde staan; op true zetten degradeert het contactgegeven dat\
        \ nu default is voor hetzelfde type."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactgegevenUpdateRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Contactgegeven succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ContactgegevenOfScopeNietGevonden"
        "409":
          description: Combinatie van type en waarde bestaat al voor deze partij
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
    post:
      summary: Toevoegen nieuwe contactgegeven voor een partij
      operationId: addContactgegeven
      description: "Voegt een contactgegeven toe. Creëert automatisch ontbrekende partijen —\
        \ ook wanneer een eerdere partij met deze identificatie inmiddels (soft-)verwijderd is,\
        \ wordt een nieuwe partij aangemaakt in plaats van de oude te herstellen. Bestaat de\
        \ combinatie (partij, type, waarde) al — voor type Email wordt de waarde daarbij\
        \ case-insensitief vergeleken — dan wordt er niets toegevoegd of gewijzigd en volgt een\
        \ 409. Gebruik PUT om een bestaand contactgegeven te wijzigen of er een scope aan toe\
        \ te voegen."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactgegevenRequest"
        required: true
      responses:
        "201":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Contactgegeven succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactgegevenResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ScopeUitRequestNietGevonden"
        "409":
          description: Contactgegeven met dit type en deze waarde bestaat al voor deze partij.
            Gebruik PUT om het bestaande contactgegeven te wijzigen. Kan zeldzaam ook optreden
            bij een gelijktijdige write die op dezelfde unique constraint botst.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/contactgegeven/{contactgegevenId}:
    delete:
      summary: Verwijder contactgegeven (soft-delete)
      operationId: verwijderContactgegeven
      description: "Markeert het contactgegeven als verwijderd. Het contactgegeven is daarna\
        \ niet meer opvraagbaar. De rij blijft in de database staan (soft delete), maar er is\
        \ geen herstelfunctie via de API. Was dit het laatste actieve contactgegeven of voorkeur\
        \ van de partij, dan wordt de partij zelf ook soft-deleted en is deze niet meer\
        \ opvraagbaar via GET partij."
      tags:
      - Profiel
      parameters:
      - name: contactgegevenId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijIdentificatieRequest"
        required: true
      responses:
        "204":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Contactgegeven succesvol verwijderd
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ContactgegevenNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener:
    post:
      summary: Voegt een dienstverlener toe
      operationId: addDienstverlener
      description: "Voegt een dienstverlener toe met optionele beschrijving. Bestaat de naam\
        \ al, dan wordt de bestaande dienstverlener teruggegeven; een afwijkende beschrijving\
        \ levert een 409 in plaats van een stille overschrijving. De beschrijving ligt daarmee\
        \ vast bij het aanmaken: er is geen operatie om hem later te wijzigen. Let op dat een\
        \ dienstverlener ook impliciet ontstaat via POST /dienstverlener/{dienstverlenerNaam}/diensten,\
        \ en dan géén beschrijving krijgt; die kan achteraf niet meer worden gezet."
      tags:
      - Dienstverlener
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DienstverlenerRequest"
        required: true
      responses:
        "201":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Dienstverlener succesvol toegevoegd of al aanwezig met dezelfde
            beschrijving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstverlenerResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "409":
          description: Dienstverlener bestaat al met een andere beschrijving
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener/{dienstverlenerNaam}/diensten:
    post:
      summary: Voegt een dienst toe aan een dienstverlener
      operationId: addDienstToDienstverlener
      description: "Voegt een dienst toe aan een dienstverlener. Bestaat de dienstverlener\
        \ nog niet, dan wordt hij aangemaakt zonder beschrijving; vandaar dat deze operatie\
        \ geen 404 kent."
      tags:
      - Dienstverlener
      parameters:
      - name: dienstverlenerNaam
        in: path
        required: true
        schema:
          # Dezelfde pattern als DienstverlenerRequest.naam. Deze operatie maakt de
          # dienstverlener aan als hij nog niet bestaat, dus zonder de constraint ontstaat via
          # het pad een naam die de bodyroute zou hebben geweigerd (#967).
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DienstRequest"
        required: true
      responses:
        "201":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Dienst succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstResponse"
        "400":
          $ref: "#/components/responses/OngeldigePadparameterOfRequestBody"
        "409":
          description: Dienst bestaat al met een andere beschrijving
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/dienstverlener/{naam}:
    get:
      summary: Vraagt gegevens van dienstverlener
      operationId: getDienstverlener
      description: "Geeft gegevens van gevraagde dienstverlener terug, inclusief de\
        \ aangesloten diensten."
      tags:
      - Dienstverlener
      parameters:
      - name: naam
        in: path
        required: true
        schema:
          # Zie de gelijknamige parameter op POST .../diensten. Een leesactie kan geen data
          # bederven, maar zonder de constraint hangt het van de route af of dezelfde naam
          # geldig heet te zijn.
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Dienstverlener succesvol opgehaald
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DienstverlenerResponse"
        "400":
          $ref: "#/components/responses/OngeldigePadparameter"
        "404":
          description: Dienstverlener niet gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/emailverificatie:
    post:
      summary: Verifieer een email met een verificatie code
      operationId: verifieerEmail
      description: Verifieert een email adres aan de hand van de eerder aangevraagde
        verificatie code.
      tags:
      - EmailVerificatie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificatieRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Email verificatie succesvol
        "400":
          description: "Request body ontbreekt, is ongeldig (schemaviolatie of een\
            \ identificatieNummer dat niet bij het identificatieType past; dan is\
            \ `violations` gevuld), of de verificatie is mislukt."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpValidationProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/emailverificatie/code:
    post:
      summary: (Opnieuw) aanvragen voor een code van een (al geverifieerde) mail adres
      operationId: vraagEmailVerificatieCodeAan
      description: "Vraagt een email verificatie code aan. Let op, bij het aanmaken\
        \ van een profiel wordt al een email verificatie code aangevraagd. Dit is\
        \ voor het opnieuw aanvragen van een code."
      tags:
      - EmailVerificatie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificatieCodeAanvraagRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Email verificatie code aanvraag succesvol
        "400":
          description: "Request body ontbreekt of is ongeldig. Bij bean-validatie is\
            \ `violations` gevuld."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpValidationProblem"
        "404":
          description: Partij of Contactgegeven niet gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
        "503":
          description: Service tijdelijk niet beschikbaar
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
  /api/profielservice/v1/partij:
    post:
      summary: Ophalen profiel van een partij
      operationId: getPartij
      description: Haalt het profiel op van een partij
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Partij succesvol opgehaald
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartijResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          description: Partij niet gevonden of is verwijderd
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/partijen/bulk:
    post:
      summary: Ophalen profielen van meerdere partijen
      operationId: getPartijBulk
      description: Haalt profielen op van meerdere partijen. Niet-gevonden partijen
        worden stilzwijgend weggelaten.
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijBulkRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Alle profielen succesvol opgehaald
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartijResponse"
        "206":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Profielen gedeeltelijk opgehaald
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartijResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          description: Geen enkel profiel gevonden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/voorkeur:
    put:
      summary: Update voorkeur van een partij
      operationId: updateVoorkeur
      description: "Werk voorkeurType, waarde en scope van een voorkeur bij. Identificatie kan\
        \ niet aangepast worden."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoorkeurUpdateRequest"
        required: true
      responses:
        "200":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Voorkeur succesvol bijgewerkt
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/VoorkeurOfScopeNietGevonden"
        "409":
          description: "Andere voorkeur bestaat al voor deze partij, type en scope"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
    post:
      summary: Toevoegen nieuwe voorkeur voor een partij
      operationId: addVoorkeur
      description: "Voegt een voorkeur toe. Creëert automatisch ontbrekende partijen — ook\
        \ wanneer een eerdere partij met deze identificatie inmiddels (soft-)verwijderd is,\
        \ wordt een nieuwe partij aangemaakt in plaats van de oude te herstellen. Bestaat er al\
        \ een actieve voorkeur voor dezelfde (partij, voorkeurType, scope), dan wordt er niets\
        \ toegevoegd of gewijzigd en volgt een 409. Gebruik PUT om een bestaande voorkeur te\
        \ wijzigen."
      tags:
      - Profiel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoorkeurRequest"
        required: true
      responses:
        "201":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Voorkeur succesvol toegevoegd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoorkeurResponse"
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/ScopeUitRequestNietGevonden"
        "409":
          description: Voorkeur voor deze partij, scope en voorkeurType bestaat al. Gebruik
            PUT om de bestaande voorkeur te wijzigen. Kan zeldzaam ook optreden wanneer twee
            gelijktijdige requests dezelfde nieuwe partij aanmaken en op uk_identificatie botsen.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "500":
          $ref: "#/components/responses/InterneServerfout"
  /api/profielservice/v1/voorkeur/{voorkeurId}:
    delete:
      summary: Verwijder voorkeur (soft-delete)
      operationId: verwijderVoorkeur
      description: "Markeert de voorkeur als verwijderd. De voorkeur is daarna niet meer\
        \ opvraagbaar. De rij blijft in de database staan (soft delete), maar er is geen\
        \ herstelfunctie via de API. Was dit de laatste actieve voorkeur of contactgegeven van\
        \ de partij, dan wordt de partij zelf ook\
        \ soft-deleted en is deze niet meer opvraagbaar via GET partij."
      tags:
      - Profiel
      parameters:
      - name: voorkeurId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartijIdentificatieRequest"
        required: true
      responses:
        "204":
          headers:
            API-Version:
              $ref: "#/components/headers/ApiVersion"
          description: Voorkeur succesvol verwijderd
        "400":
          $ref: "#/components/responses/OngeldigeRequestBody"
        "404":
          $ref: "#/components/responses/VoorkeurNietGevonden"
        "500":
          $ref: "#/components/responses/InterneServerfout"
components:
  headers:
    ApiVersion:
      description: "Semantische versie van het API-contract, zoals ADR /core/version-header
        vereist. SecurityHeadersFilter zet hem op elke respons; ApiVersion.CURRENT is de bron."
      required: true
      schema:
        type: string
        examples:
        - 1.0.0
  responses:
    InterneServerfout:
      description: Interne serverfout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    OngeldigeRequestBody:
      description: Request body ontbreekt of is ongeldig
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpValidationProblem"
    OngeldigePadparameter:
      description: Padparameter is ongeldig
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpValidationProblem"
    # Niet de gedeelde OngeldigeRequestBody: op deze operatie kan ook de padparameter
    # de 400 geven, en die beschrijving spreekt alleen over de body.
    OngeldigePadparameterOfRequestBody:
      description: "Padparameter of request body is ongeldig, of de request body ontbreekt"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpValidationProblem"
    ContactgegevenOfScopeNietGevonden:
      description: "Contactgegeven of partij niet gevonden, of de dienstverlener of\
        \ dienst uit de opgegeven scope bestaat niet"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    VoorkeurOfScopeNietGevonden:
      description: "Voorkeur of partij niet gevonden, of de dienstverlener of dienst\
        \ uit de opgegeven scope bestaat niet"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    ContactgegevenNietGevonden:
      description: Contactgegeven of partij niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    VoorkeurNietGevonden:
      description: Voorkeur of partij niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
    ScopeUitRequestNietGevonden:
      description: Dienstverlener of dienst uit de scope bestaat niet
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/HttpProblem"
  schemas:
    # De pattern "^[^\r\n]*\S[^\r\n]*$" op de tekstvelden die een betekenisvolle waarde
    # moeten dragen — verplicht én optioneel, zoals de scope-velden — wijst lege en
    # alleen-witruimte waarden af, en meteen ook CR/LF. Hij is met opzet zo
    # geschreven en niet als ".*\S.*": Jakarta @Pattern doet een full match waarbij "."
    # geen newline matcht, en de inline-vlag "(?s)" die dat repareert bestaat niet in
    # ECMA 262 — daarmee wordt het contract ongeldig en valt de contractvalidatie op elk
    # endpoint om. Zie BlancoWaardenIntegrationTest voor de volledige afweging.
    ContactType:
      type: string
      enum:
      - Email
      - Telefoonnummer
      - ApplicatieId
    ContactgegevenRequest:
      description: "Request object voor het toevoegen van een contactgegeven aan een partij. scope mag worden weggelaten of expliciet op null gezet; beide betekenen dat het veld niet is opgegeven. Bij type Email moet waarde een geldig e-mailadres zijn; bij de overige types is de inhoud vormvrij."
      # waarde is polymorf: een format op het veld zelf zou telefoonnummers gaan weigeren. De
      # if/then hieronder wordt door de contractvalidatie geëvalueerd, maar de generator maakt er
      # geen Jakarta-constraint van; de server dwingt de regel af met de class-level constraint.
      # Die twee vendor-extensies horen bij elkaar; zie ValidatieExtensiesTest.
      #
      # Let op dat format: email strenger is dan Jakarta @Email: het contract wijst een
      # bare-IPv4-domein en een TLD van één teken af die de server accepteert. De divergentie
      # loopt één kant op en ligt vast in EmailFormaatIntegrationTest.
      x-class-extra-annotation: "@nl.rijksoverheid.moz.validation.ValidEmailWaarde"
      x-implements:
      - nl.rijksoverheid.moz.validation.HeeftContactWaarde
      if:
        properties:
          type:
            const: Email
        required:
        - type
      then:
        properties:
          waarde:
            format: email
      type: object
      required:
      - identificatieType
      - identificatieNummer
      - type
      - waarde
      properties:
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        type:
          $ref: "#/components/schemas/ContactType"
        waarde:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        scope:
          $ref: "#/components/schemas/ScopeRequest"
    ContactgegevenResponse:
      description: "Contactgegeven van een partij."
      # De velden die de server altijd meestuurt staan als required, zodat een consumer niet
      # defensief hoeft te coderen tegen nulls die niet kunnen optreden. Wat optioneel is,
      # draagt "null" in zijn type: Jackson staat hier op de standaard ALWAYS-inclusie, dus
      # een leeg veld gaat als expliciete null over de lijn en niet als ontbrekende sleutel.
      #
      # required bewaakt de mapper niet: het vraagt alleen of de sleutel er is, en die is er
      # altijd — ook met waarde null. Het documenteert wat een consumer mag verwachten.
      #
      # De nullable velden staan niet in required omdat de generator er dan @NotNull op zet.
      type: object
      required:
      - id
      - type
      - waarde
      - isGeverifieerd
      - isDefault
      - createdAt
      - lastUpdated
      - scopes
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/ContactType"
        waarde:
          type: string
        isGeverifieerd:
          type: boolean
        isDefault:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Instant"
        lastUpdated:
          $ref: "#/components/schemas/Instant"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeResponse"
    ContactgegevenUpdateRequest:
      description: "Request object voor het bijwerken van een contactgegeven. scope mag worden weggelaten of expliciet op null gezet; beide betekenen dat het veld niet is opgegeven. Bij type Email moet waarde een geldig e-mailadres zijn; bij de overige types is de inhoud vormvrij."
      # Zie ContactgegevenRequest voor waarom de e-mailregel als if/then plus class-level
      # constraint staat en niet als format op waarde.
      x-class-extra-annotation: "@nl.rijksoverheid.moz.validation.ValidEmailWaarde"
      x-implements:
      - nl.rijksoverheid.moz.validation.HeeftContactWaarde
      if:
        properties:
          type:
            const: Email
        required:
        - type
      then:
        properties:
          waarde:
            format: email
      type: object
      required:
      - identificatieType
      - identificatieNummer
      - type
      - waarde
      - id
      properties:
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        type:
          $ref: "#/components/schemas/ContactType"
        waarde:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        scope:
          $ref: "#/components/schemas/ScopeRequest"
        id:
          $ref: "#/components/schemas/UUID"
        isDefault:
          type: [boolean, "null"]
          description: "Weglaten of op null zetten laat de huidige waarde staan; true maakt\
            \ dit het standaard-contactgegeven voor zijn type en degradeert het vorige."
    DienstRequest:
      description: Request object voor het toevoegen van een dienst aan een dienstverlener
      type: object
      required:
      - naam
      properties:
        naam:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        beschrijving:
          type: [string, "null"]
    DienstResponse:
      # Zie ContactgegevenResponse voor waarom required hier staat. beschrijving is
      # optioneel omdat een dienst zonder beschrijving aangemaakt kan worden.
      type: object
      required:
      - id
      - naam
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        naam:
          type: string
        beschrijving:
          type: [string, "null"]
    DienstverlenerRequest:
      description: Request object voor het toevoegen van een dienstverlener
      type: object
      required:
      - naam
      properties:
        naam:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        beschrijving:
          type: [string, "null"]
    DienstverlenerResponse:
      # Zie ContactgegevenResponse. beschrijving is optioneel; diensten is altijd
      # aanwezig en hooguit leeg.
      type: object
      required:
      - naam
      - diensten
      properties:
        naam:
          type: string
        beschrijving:
          type: [string, "null"]
        diensten:
          type: array
          items:
            $ref: "#/components/schemas/DienstResponse"
    EmailVerificatieCodeAanvraagRequest:
      # Bewust GEEN elfproef, in tegenstelling tot EmailVerificatieRequest. De
      # endpoints die een partij kunnen aanmaken (POST /contactgegeven en POST /voorkeur,
      # de enige twee die findOrCreatePartij aanroepen) valideren het
      # identificatieNummer evenmin, dus een profiel kan onder een nummer bestaan dat
      # de elfproef niet doorstaat. Zou dit endpoint de controle wel doen, dan kon zo'n
      # gebruiker nooit meer een vervangende code aanvragen. De controle overal
      # gelijktrekken staat nog open.
      type: object
      required:
      - email
      - identificatieNummer
      - identificatieType
      properties:
        email:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
          # Anders dan ContactgegevenRequest.waarde draagt dit veld altijd een e-mailadres, dus
          # kan format hier gewoon op het veld. De generator vertaalt format niet, vandaar de
          # extensie ernaast.
          format: email
          x-field-extra-annotation: "@jakarta.validation.constraints.Email"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
    EmailVerificatieRequest:
      description: Request object voor het verifiëren van een emailadres
      # De elfproef op BSN/RSIN en de lengtecontrole op KVK zijn niet in JSON Schema
      # uit te drukken; de generator zet daarom deze class-level constraint op de DTO.
      # Zie IdentificatieNummerValidator en EmailVerificatieValidatieIntegrationTest.
      # De interface maakt de validator herbruikbaar over meerdere requests heen.
      # Deze twee extensies worden meegepubliceerd op /openapi.json, inclusief de interne
      # klassenamen. Bewust geaccepteerd: filteren zou een tweede bron vragen.
      x-class-extra-annotation: "@nl.rijksoverheid.moz.validation.ValidIdentificatieNummer"
      x-implements:
      - nl.rijksoverheid.moz.validation.HeeftIdentificatie
      type: object
      required:
      - email
      - identificatieNummer
      - identificatieType
      - verificatieCode
      properties:
        email:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
          # Zie EmailVerificatieCodeAanvraagRequest.email.
          format: email
          x-field-extra-annotation: "@jakarta.validation.constraints.Email"
        identificatieNummer:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
        identificatieType:
          $ref: "#/components/schemas/IdentificatieType"
        verificatieCode:
          type: string
          pattern: "^[^\\r\\n]*\\S[^\\r\\n]*$"
